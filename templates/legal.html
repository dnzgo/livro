<!doctype html>
<html lang="{{lang}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{page_title}} · Livro</title>
<meta name="description" content="Livro · {{page_title}}">
{{alternates}}
<link rel="icon" href="{{root}}assets/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="{{root}}styles.css">
</head>
<body class="legal-page">
<!-- Generated by build.py from legal/{{source}}. Edit the Word file, not this page. -->
<header class="site-header">
  <div class="wrap nav">
    <a class="brand" href="index.html" aria-label="{{nav.home}}"><img src="{{root}}assets/livro-wordmark.png" alt="Livro" width="83" height="48"></a>
    <nav aria-label="{{nav.label}}">
      <a href="index.html#how">{{nav.how}}</a>
      <a href="index.html#pricing">{{nav.pricing}}</a>
      <a href="index.html#team">{{nav.team}}</a>
      {{langs}}
    </nav>
  </div>
</header>
<main class="wrap legal">
  <aside class="toc" aria-label="{{legal.contents}}">
    <p class="eyebrow">{{legal.contents}}</p>
    <ol>
{{toc}}
    </ol>
  </aside>
  <article>
    <p class="eyebrow">{{legal.eyebrow}}</p>
    <h1>{{title}}</h1>
{{body}}
  </article>
</main>
{{footer}}
</body>
</html>
